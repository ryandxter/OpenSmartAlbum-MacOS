name: 'Release'

# OpenSmartAlbum release pipeline.
#
# One tag -> one GitHub Release -> the in-app OTA updater reads
# `latest.json` from that release (see src-tauri/tauri.conf.json
# plugins.updater.endpoints). Every platform job MUST contribute its
# signed updater artifacts (.app.tar.gz/.sig on macOS, .exe/.sig on
# Windows), otherwise OTA silently breaks for that platform.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY — the FULL minisign secret key file content
#   (both lines, including the "untrusted comment:" line) matching the
#   pubkey in tauri.conf.json. A bare base64 line or an empty value fails
#   signing with "Missing comment in secret key".
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — the password chosen when the key
#   was generated; leave unset/empty if the key has no password.
# Optional (macOS distribution signing/notarization) can be added later;
# unsigned macOS builds still install via the Gatekeeper bypass steps
# documented in README.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag to release (e.g. v1.0.23). Leave empty to use package.json version.'
        required: false
        default: ''

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Sequential on purpose: tauri-action merges each platform into the
      # shared latest.json. Parallel jobs race on that file and the last
      # finisher wipes the other platforms' updater entries.
      max-parallel: 1
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rust-target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            rust-target: 'x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
            rust-target: 'x86_64-pc-windows-msvc'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version tag
        id: tag_info
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            PKG_VER=$(node -p "require('./package.json').version")
            TAG="v$PKG_VER"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved release tag: $TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify version sync (single source of truth = package.json)
        shell: bash
        env:
          TAG: ${{ steps.tag_info.outputs.tag }}
        run: |
          node scripts/bump-version.mjs --check
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$PKG_VER" ]; then
            echo "::error::Release tag $TAG does not match package.json version v$PKG_VER. Bump the version first: npm run version:bump -- $TAG"
            exit 1
          fi

      - name: Generate release notes from git commits
        id: release_notes
        shell: bash
        env:
          TAG: ${{ steps.tag_info.outputs.tag }}
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | grep -v "^$TAG$" | head -n 1 || echo "")
          echo "Previous tag: $PREV_TAG"
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          if [ -n "$PREV_TAG" ]; then
            echo "### What's New in $TAG:" >> $GITHUB_OUTPUT
            git log "$PREV_TAG..HEAD" --pretty=format:"- %s" --no-merges >> $GITHUB_OUTPUT
          else
            echo "### Changes in $TAG:" >> $GITHUB_OUTPUT
            git log -n 10 --pretty=format:"- %s" --no-merges >> $GITHUB_OUTPUT
          fi
          echo "" >> $GITHUB_OUTPUT
          echo "---" >> $GITHUB_OUTPUT
          echo "Download the macOS/Windows installer below or update directly within OpenSmartAlbum." >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Run verification tests
        run: npm test

      - name: Build Tauri app and publish signed release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.tag_info.outputs.tag }}
          releaseName: 'OpenSmartAlbum ${{ steps.tag_info.outputs.tag }}'
          releaseBody: ${{ steps.release_notes.outputs.notes }}
          includeUpdaterJson: true
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

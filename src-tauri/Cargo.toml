[package]
name = "opensmartalbum"
version = "1.4.14"
description = "OpenSmartAlbum - Free & Open Source Desktop Photo Album Layout Studio"
authors = ["OpenSmartAlbum Contributors"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "opensmartalbum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
cc = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
rusqlite = { version = "0.34", features = ["bundled"] }
uuid = { version = "1.0", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
rfd = "0.15"
rayon = "1.10"
base64 = "0.22"
kamadak-exif = "0.6"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
fontdue = "0.9"
ttf-parser = "0.25"
tiff = { version = "0.11", default-features = false, features = ["lzw", "deflate"] }
tract-onnx = "0.21.8"
ndarray = "0.16"

